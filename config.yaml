# pdf-to-epub engine configuration
scout:
  backend: local                 # local | api
  ollama_url: http://localhost:11434
  vl_model: qwen2.5vl:7b
  text_model: qwen3:8b
  # --- external API backend（scout.backend=api 时生效）---
  api_base: ""                   # OpenAI 兼容端点，如 https://openrouter.ai/api/v1
  api_key: ""                    # 也可走环境变量 SCOUT_API_KEY
  api_model: ""                  # 如 google/gemini-2.5-pro
engine:
  mode: auto                     # auto（批量智能）| guided（主动审阅）
